# Basado en api-s3.zip del curso: se conservan las funciones originales.
# Se usa integración lambda-proxy para responder con HTTP real.
org: renzoliang
service: api-s3

provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  stage: dev
  memorySize: 256
  timeout: 20
  iam:
    role: arn:aws:iam::956452656667:role/LabRole

functions:
  lista_buckets:
    handler: lista_buckets.lambda_handler
    memorySize: 512
    events:
      - http:
          path: s3/lista-buckets
          method: get
          cors: true

  lista_objetos_bucket:
    handler: lista_objetos_bucket.lambda_handler
    events:
      - http:
          path: s3/bucket/lista-objetos
          method: post
          cors: true

  crear_bucket:
    handler: crear_bucket.lambda_handler
    events:
      - http:
          path: s3/bucket/crear
          method: post
          cors: true

  crear_directorio:
    handler: crear_directorio.lambda_handler
    events:
      - http:
          path: s3/bucket/crear-directorio
          method: post
          cors: true

  subir_archivo:
    handler: subir_archivo.lambda_handler
    memorySize: 512
    events:
      - http:
          path: s3/bucket/subir-archivo
          method: post
          cors: true
